name: Actions Startup Diagnostic

on:
  push:
    branches:
      - diag/actions-startup

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Runtime check
        run: |
          node --version
          npm --version
          echo "actions-startup-ok"
