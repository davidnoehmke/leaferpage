name: Hydrogen Oxygen Deploy

on:
  push:
    branches:
      - switch-to-headless
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build Hydrogen storefront
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Oxygen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN }}
    steps:
      - name: Checkout code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        if: ${{ env.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN != '' }}
        run: npx shopify hydrogen deploy
