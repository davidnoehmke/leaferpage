name: Storefront 1000165377
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Emit generated lockfile
        shell: bash
        run: |
          echo "__LOCKFILE_BEGIN__"
          gzip -c package-lock.json | base64 -w0
          echo
          echo "__LOCKFILE_END__"

      - name: Build and Publish to Oxygen
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000165377 }}
